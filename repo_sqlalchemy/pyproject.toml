[project]
name = "repo-sqlalchemy"
version = "0.1.0"
description = "package contains defenitions implementation of data access layer with SQLAlchemy lib."
authors = [
    {name = "Tony",email = "ant_9393@bk.ru"}
]
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy (>=2.0.49,<3.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "core-contracts (==0.1.0)"
]

[tool.poetry.dependencies]
core-contracts = { path = "../core_contracts", develop = true}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
